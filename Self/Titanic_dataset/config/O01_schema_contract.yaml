dataset_info:
  name: "Titanic-Dataset"
  version: "1.0"
  description: "This dataset contains information about the passengers of the Titanic, including their demographics,  
  ticket information, and survival status. It is commonly used for machine learning and data analysis tasks."
  source: "Kaggle Titanic Dataset"
  source_url: "https://www.kaggle.com/c/titanic/data"
  source_license: "CC0: Public Domain"

expected_columns:
  passenger_id:
    type: integer
    nullable: false
    unique: true
    description: "Unique identifier for each passenger."
  survived:
    type: integer
    nullable: false
    unique: false
    description: "Survival status of the passenger (0 = No, 1 = Yes)."
  pclass:
    type: integer
    nullable: false
    unique: false
    description: "Passenger class (1 = 1st, 2 = 2nd, 3 = 3rd)."
  name:
    type: string
    nullable: false
    unique: false
    description: "Name of the passenger."
  sex:
    type: string
    nullable: false
    allowable_values: ["male", "female"]
    description: "Gender of the passenger (male or female)."
  age:
    type: float
    nullable: true
    unique: false
    description: "Age of the passenger in years. Can be null if age is unknown."
  sib_sp:
    type: integer
    nullable: false
    unique: false
    description: "Number of siblings/spouses aboard the Titanic."
  parch:
    type: integer
    nullable: false
    unique: false
    description: "Number of parents/children aboard the Titanic."
  ticket:
    type: string
    nullable: false
    unique: false
    description: "Ticket number of the passenger."
  fare:
    type: float
    nullable: false
    unique: false
    description: "Fare paid by the passenger."
  cabin:
    type: string
    nullable: true
    unique: false
    description: "Cabin number of the passenger. Can be null if cabin is unknown."
  embarked:
    type: string
    nullable: true
    allowable_values: ["C", "Q", "S"]
    description: "Port of embarkation (C = Cherbourg, Q = Queenstown, S = Southampton). Can be null if unknown."