# ==============================================================================
# O01_cleaning_rules.yaml
# Preprocessing, Imputation, and Outlier Threshold Configuration
# ==============================================================================

missingness_rules:
  knn_imputer:
    n_neighbors: 5
    weights: "uniform"
  indicator_flagging_cols:
    - "TotalCharges"
  mnar_sentinel_value: -999.0

structural_cleaning:
  text_columns:
    - "Contract"
    - "PaymentMethod"
  case_format: "lower"
  strip_whitespace: true
  fuzzy_matching:
    enabled: true
    similareshity_throld: 85
    canonical_mappings:
      Contract:
        "month-to-month": ["month to month", "m2m", "month-month", "monthly"]
        "one year": ["1 year", "1yr", "1-year"]
        "two year": ["2 year", "2yr", "2-year"]

outlier_detection:
  z_score:
    threshold: 3.0
  iqr:
    multiplier: 1.5
  isolation_forest:
    contamination: 0.02
    random_state: 42
  numerical_columns_to_check:
    - "tenure_months"
    - "monthly_charges"
    - "total_charges"

temporal_alignment:
  target_timezone: "UTC"
  fill_strategy: "ffill"
  resample_frequency: "1D"

mathematical_sanitization:
  float_precision_tolerance: 1e-6
  mask_inf_with_nan: true
  zero_division_default: 0.0




